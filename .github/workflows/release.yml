name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0.0
        required: true
        default: 1.1.0
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  ACR_AUTHOR: Cino
  ACR_DESCRIPTION: 割草 bACR
  ACR_JOB: RPR,NIN
  ACR_CONTENT_SCOPE: HighEnd
  ACR_API_VERSION: "15"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "${{ github.ref_name }}" }
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          $parsed = $null
          if (-not [Version]::TryParse($version, [ref]$parsed)) { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check references
        id: references
        shell: pwsh
        run: |
          $required = @("Dalamud.dll", "Dalamud.Bindings.ImGui.dll", "FFXIVClientStructs.dll", "InteropGenerator.Runtime.dll", "Lumina.dll", "Lumina.Excel.dll", "ECommons.dll", "PromeRotation.dll")
          $missing = $required | Where-Object { -not (Test-Path "lib/$_") }
          if ($missing.Count -gt 0) { throw "Missing lib references: $($missing -join ', ')" }
          $version = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "lib/PromeRotation.dll")).Version.ToString()
          "prome_version=$version" >> $env:GITHUB_OUTPUT

      - name: Sync metadata version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Release version is empty" }
          foreach ($path in @("Ninja/NinjaRotation.cs", "Reaper/ReaperRotation.cs")) {
            $text = Get-Content -Raw -Encoding UTF8 $path
            $jobId = if ($path.StartsWith("Ninja/")) { "30u" } else { "39u" }
            $updated = [regex]::Replace($text, '(\[RotationMetadata\(' + $jobId + ',\s*"[^"]+",\s*"[^"]+",\s*")[^"]+("),', ('${1}' + $version + '${2},'), 1)
            if ($updated -eq $text -and $text -notmatch ('"' + [regex]::Escape($version) + '"')) { throw "RotationMetadata was not found in $path" }
            Set-Content -Encoding UTF8 -Path $path -Value $updated
          }

      - name: Build
        shell: pwsh
        run: |
          dotnet build Luli.csproj --configuration Release -p:DalamudReferenceRoot="$env:GITHUB_WORKSPACE\lib" -p:PromeRotationReferenceRoot="$env:GITHUB_WORKSPACE\lib"
          if (-not (Test-Path "$env:APPDATA\XIVLauncherCN\pluginConfigs\PromeRotation\ACR\Cino\LuliReaperPR.dll")) { throw "ACR assembly was not built" }

      - name: Package
        shell: pwsh
        run: |
          $dist = "${{ runner.temp }}\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $package = Join-Path $dist "Cino"
          New-Item -ItemType Directory -Force $package | Out-Null
          $output = "$env:APPDATA\XIVLauncherCN\pluginConfigs\PromeRotation\ACR\Cino"
          Copy-Item "$output\LuliReaperPR.dll" $package -Force
          Copy-Item "$output\LuliReaperPR.deps.json" $package -Force
          Compress-Archive -Path $package -DestinationPath "$dist\latest.zip" -Force
          $sha = (Get-FileHash -Algorithm SHA256 "$dist\latest.zip").Hash.ToLowerInvariant()
          $manifest = Get-Content -Raw -Encoding UTF8 "repo.json" | ConvertFrom-Json
          $manifest.sha256 = $sha
          $manifest.downloadUrl = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"
          $manifest.sourceRepositoryUrl = ""
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 "$dist\repo.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ${{ runner.temp }}\dist\latest.zip
            ${{ runner.temp }}\dist\repo.json
